<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handwriting</title>

<style>
body {
    font-family: sans-serif;
    text-align: center;
    margin: 20px;
    touch-action: none;
}

textarea {
    width: 80%;
    height: 80px;
    font-size: 24px;
    padding: 10px;
    margin-bottom: 20px;
}

canvas {
    border: 2px solid #333;
    background: white;
    display: block;
    margin: auto;
    touch-action: none;
}

button {
    margin: 10px 5px;
    padding: 12px 25px;
    font-size: 18px;
    cursor: pointer;
}

.active {
    background: #333;
    color: white;
}
</style>

</head>

<body>

<h1>手書き入力</h1>

<textarea placeholder="テキスト入力"></textarea>

<canvas id="canvas" width="600" height="400"></canvas>

<div>
    <button id="pen" class="active">✏️ ペン</button>
    <button id="eraser">🧽 消しゴム</button>
    <button id="clear">消去</button>
</div>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let drawing = false;
let mode = "pen";

ctx.lineWidth = 5;
ctx.lineCap = "round";
ctx.strokeStyle = "black";


// 座標取得
function getPosition(e){
    const rect = canvas.getBoundingClientRect();

    return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
    };
}


// 描画開始
canvas.addEventListener("pointerdown", e => {

    drawing = true;

    const pos = getPosition(e);

    ctx.beginPath();
    ctx.moveTo(pos.x,pos.y);

});


// 描画中
canvas.addEventListener("pointermove", e => {

    if(!drawing) return;

    const pos = getPosition(e);

    ctx.lineTo(pos.x,pos.y);
    ctx.stroke();

});


// 描画終了
canvas.addEventListener("pointerup", ()=>{
    drawing=false;
});

canvas.addEventListener("pointerleave", ()=>{
    drawing=false;
});


// ペン
document.getElementById("pen").onclick = ()=>{

    mode="pen";

    ctx.globalCompositeOperation="source-over";
    ctx.lineWidth=5;

    document.getElementById("pen").classList.add("active");
    document.getElementById("eraser").classList.remove("active");

};


// 消しゴム
document.getElementById("eraser").onclick = ()=>{

    mode="eraser";

    ctx.globalCompositeOperation="destination-out";
    ctx.lineWidth=30;

    document.getElementById("eraser").classList.add("active");
    document.getElementById("pen").classList.remove("active");

};


// 全消去
document.getElementById("clear").onclick = ()=>{

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

};


</script>

</body>
</html>
